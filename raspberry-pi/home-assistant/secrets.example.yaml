# EXAMPLES ONLY: copy to secrets.yaml locally and replace every value.
# The documentation address, invented MAC, hostname and token are not real deployment values.
proxmox_wake_mac: 02:00:00:00:00:01
proxmox_broadcast_address: 192.0.2.255
proxmox_reachability_command: python3 -c 'import socket; s=socket.socket(); s.settimeout(3); print("ON"
  if s.connect_ex(("proxmox.example.invalid", 8006)) == 0 else "OFF"); s.close()'
proxmox_shutdown_url: https://proxmox.example.invalid:8006/api2/json/nodes/EXAMPLE_NODE/status
proxmox_shutdown_authorization: PVEAPIToken=EXAMPLE_USER@pve!EXAMPLE_TOKEN=REPLACE_ME
nanoleaf_config_entry_id: REPLACE_WITH_NANOLEAF_CONFIG_ENTRY_ID
proxmox_config_entry_id: REPLACE_WITH_PROXMOX_CONFIG_ENTRY_ID
