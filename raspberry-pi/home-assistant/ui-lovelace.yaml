# Public dashboard example. Supporting configuration is included alongside this file.
# Replace example entities and local secrets using integrations.md.
title: Home
views:
- title: Home
  path: home
  icon: mdi:home
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Lighting
      icon: mdi:lightbulb-outline
    - type: tile
      entity: light.govee_strip
      name: Govee
      tap_action:
        action: more-info
      icon_tap_action:
        action: toggle
      features:
      - type: light-brightness
      grid_options:
        columns: 12
        rows: 2
      visibility:
      - condition: state
        entity: light.govee_strip
        state:
        - 'on'
        - 'off'
    - type: tile
      entity: light.govee_strip
      name: Govee unavailable
      icon: mdi:lightbulb-off-outline
      tap_action:
        action: none
      icon_tap_action:
        action: none
      grid_options:
        columns: 12
        rows: 1
      visibility:
      - condition: state
        entity: light.govee_strip
        state_not:
        - 'on'
        - 'off'
    - type: tile
      entity: light.nanoleaf_controls
      name: Nanoleaf
      tap_action:
        action: more-info
      icon_tap_action:
        action: toggle
      features:
      - type: light-brightness
      grid_options:
        columns: 12
        rows: 2
      visibility:
      - condition: state
        entity: input_select.nanoleaf_connection
        state: Ready
      - condition: state
        entity: light.nanoleaf_strip
        state:
        - 'on'
        - 'off'
      - condition: state
        entity: script.nanoleaf_reconnect
        state: 'off'
    - type: tile
      entity: script.nanoleaf_reconnect
      name: Nanoleaf · Disconnected
      icon: mdi:led-strip-variant
      hide_state: true
      tap_action:
        action: none
      icon_tap_action:
        action: none
      features:
      - type: button
        action_name: Reconnect
      grid_options:
        columns: 12
        rows: 2
      visibility:
      - condition: state
        entity: script.nanoleaf_reconnect
        state: 'off'
      - condition: or
        conditions:
        - condition: state
          entity: input_select.nanoleaf_connection
          state_not: Ready
        - condition: state
          entity: light.nanoleaf_strip
          state_not:
          - 'on'
          - 'off'
    - type: tile
      entity: script.nanoleaf_reconnect
      name: Nanoleaf · Connecting …
      icon: mdi:led-strip-variant
      hide_state: true
      tap_action:
        action: none
      icon_tap_action:
        action: none
      features:
      - type: button
        action_name: Reconnect
      grid_options:
        columns: 12
        rows: 2
      visibility:
      - condition: state
        entity: script.nanoleaf_reconnect
        state: 'on'
  - type: grid
    cards:
    - type: heading
      heading: Proxmox
      icon: mdi:server
    - type: button
      entity: binary_sensor.proxmox_online
      name: Start server
      icon: mdi:power
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.proxmox_start
      hold_action:
        action: none
      grid_options:
        columns: 12
        rows: 2
      visibility:
      - condition: state
        entity: binary_sensor.proxmox_online
        state: 'off'
    - type: button
      entity: binary_sensor.proxmox_online
      name: Shut down server
      icon: mdi:power-standby
      show_state: false
      state_color: true
      tap_action:
        action: perform-action
        perform_action: script.proxmox_shutdown
        confirmation:
          text: Shut down Proxmox and its running VMs and containers?
      hold_action:
        action: none
      grid_options:
        columns: 12
        rows: 2
      visibility:
      - condition: state
        entity: binary_sensor.proxmox_online
        state: 'on'
    - type: button
      name: Server status unknown
      icon: mdi:server-network-off
      tap_action:
        action: none
      hold_action:
        action: none
      grid_options:
        columns: 12
        rows: 2
      visibility:
      - condition: state
        entity: binary_sensor.proxmox_online
        state_not:
        - 'on'
        - 'off'
    - type: tile
      entity: sensor.proxmox_cpu_usage
      name: CPU
      tap_action:
        action: more-info
      grid_options:
        columns: 6
        rows: 1
      visibility:
      - condition: state
        entity: binary_sensor.proxmox_online
        state: 'on'
      - condition: state
        entity: sensor.proxmox_cpu_usage
        state_not:
        - unknown
        - unavailable
        - ''
    - type: tile
      entity: sensor.proxmox_memory_usage_percentage
      name: RAM
      tap_action:
        action: more-info
      grid_options:
        columns: 6
        rows: 1
      visibility:
      - condition: state
        entity: binary_sensor.proxmox_online
        state: 'on'
      - condition: state
        entity: sensor.proxmox_memory_usage_percentage
        state_not:
        - unknown
        - unavailable
        - ''
    - type: tile
      entity: sensor.proxmox_uptime
      name: Uptime
      tap_action:
        action: more-info
      grid_options:
        columns: 12
        rows: 1
      visibility:
      - condition: state
        entity: binary_sensor.proxmox_online
        state: 'on'
      - condition: state
        entity: sensor.proxmox_uptime
        state_not:
        - unknown
        - unavailable
        - ''
    - type: markdown
      content: The server is on. Reconnecting monitoring …
      grid_options:
        columns: 12
        rows: auto
      visibility:
      - condition: state
        entity: binary_sensor.proxmox_online
        state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity: sensor.proxmox_cpu_usage
          state:
          - unknown
          - unavailable
        - condition: state
          entity: sensor.proxmox_memory_usage_percentage
          state:
          - unknown
          - unavailable
  theme: Homelab
