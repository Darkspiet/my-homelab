- title: System
  path: system
  icon: mdi:cog
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Home controller
      icon: mdi:raspberry-pi
    - type: tile
      entity: sensor.pi_memory_usage
      name: Pi · Memory
      icon: mdi:memory
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.pi_disk_usage
      name: Pi · Disk usage
      icon: mdi:harddisk
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.pi_uptime
      name: Pi · Uptime
      icon: mdi:clock-outline
      grid_options:
        columns: 12
        rows: 1
  - type: grid
    cards:
    - type: heading
      heading: Connections
      icon: mdi:connection
    - type: button
      name: Reconnect Nanoleaf
      icon: mdi:bluetooth-connect
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.nanoleaf_reconnect
      hold_action:
        action: none
      grid_options:
        columns: 12
        rows: 2
      visibility:
      - condition: state
        entity: script.nanoleaf_reconnect
        state: 'off'
    - type: tile
      entity: sensor.available_lights
      name: Available lights
      grid_options:
        columns: 12
        rows: 1
    - type: markdown
      content: Govee · Local LAN control.
      grid_options:
        columns: 12
        rows: 2
  theme: Homelab
